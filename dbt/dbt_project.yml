# Proyecto dbt: capa analitica con dos fuentes, tables/table_*.csv (lo que arma vlr_pipeline process) y el
# JSON crudo de la API de GRID en grid/raw/ (vlr_pipeline grid sync). dbt no scrapea ni reemplaza tables.py:
# lee esas fuentes como "sources" y construye modelos SQL.

name: vlr_analytics
version: "0.1.0"

# Que conexion usar: busca una entrada con este nombre en profiles.yml
profile: vlr_analytics

# Donde busca dbt cada tipo de archivo (son los defaults, escritos para que se vean)
model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Lo que borra `dbt clean`
clean-targets: ["target", "dbt_packages"]

# Configuracion por carpeta de models/. Cada capa se suma en su paso:
#   staging       -> view  (paso 1); base_grid__series_state es table (config en el modelo)
#   intermediate  -> view  (paso 4)
#   marts         -> table (paso 4)
models:
  vlr_analytics:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    # marts: lo que se consulta. table = se calcula una vez en cada build y despues se lee sin recalcular
    # (una view repetiria el unnest de rondas de GRID en cada consulta).
    marts:
      +materialized: table

# Seeds: csv chicos versionados en seeds/ que `dbt seed` (o `dbt build`) carga como tablas. Para datos hechos a
# mano que el SQL necesita, como las excepciones del cruce de equipos GRID <-> vlr.
seeds:
  vlr_analytics:
    grid_team_overrides:
      +column_types:
        grid_team_id: varchar
        team_id_vlr: varchar
        note: varchar

# Variables: valores que el SQL lee con {{ var('nombre') }} y que se pueden cambiar sin tocar los modelos
# (dbt build --vars '{grid_vlr_max_hours: 24}').
vars:
  # Distancia maxima entre la hora de una serie en GRID y en vlr (las dos en UTC) para considerarlas la misma.
  grid_vlr_max_hours: 12
  # Umbrales del cruce (tests assert_coverage_*, sobre mart_tournament_coverage). Al 2026-11-23 el peor torneo
  # cubierto tiene 96.7 % de series (China Kickoff: FPX - TYLOO no esta en GRID) y 98.42 % de rondas; el total, 99.57 %.
  min_series_coverage_pct: 95
  min_round_match_pct: 97
  min_total_round_match_pct: 99
