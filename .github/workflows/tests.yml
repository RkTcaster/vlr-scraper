name: tests

# Separado del pipeline diario: corre cuando cambia el codigo, los tests o los lookups.
# Los parsers no usan red (leen html de tests/fixtures). Los csv de logs se bajan del bucket de
# Supabase Storage para que test_primary_keys cubra round_buy/round_events; sin secrets (PR de un
# fork) se saltea y esas tablas quedan vacias.
on:
  push:
    paths:
      - "vlr_pipeline/**"
      - "tests/**"
      - "requirements.txt"
      - "pytest.ini"
      - ".github/workflows/tests.yml"
  pull_request:
  workflow_dispatch:
  # El commit diario del bot (GITHUB_TOKEN) no dispara push: se corre despues del pipeline
  # para que test_lookups avise el mismo dia que aparece un mapa/agente nuevo en csv/.
  workflow_run:
    workflows: ["vlr-pipeline"]
    types: [completed]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Pull logs archive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "sin secrets, salteo los logs"; exit 0; fi
          python -m vlr_pipeline logs pull

      - name: Run tests
        run: python -m pytest -v
