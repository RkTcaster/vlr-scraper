name: vlr-pipeline

on:
  schedule:
    # El cron de GitHub va SIEMPRE en UTC. 17:00 UTC = 01:00 Shanghai (UTC+8) = 14:00 Argentina.
    # Champions 2026 (Shanghai): partidos 17:00 y 20:00 Shanghai (09:00 y 12:00 UTC), el
    # ultimo termina ~23:00 Shanghai; playoffs de octubre arrancan mas temprano. Con 17:00 UTC
    # todo lo del dia ya esta Completed. GitHub puede demorar el arranque 10-60 min.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Upload completo (todas las filas). Usar si cambio el codigo/lookups o se borro algo en Supabase"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vlr-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # main actual y no github.sha: un "Re-run" de una corrida vieja usa el sha original, y
      # correria codigo viejo sobre un scrape_log viejo (y el push termina en conflicto)
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          # misma version con la que se probo el pipeline localmente (pandas 3)
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # round_buy_/round_events_ no estan en git (vlr_pipeline/logs_archive.py): se bajan del bucket
      # de Supabase Storage. Si falla se corta la corrida: sin logs el process armaria tablas incompletas.
      - name: Pull logs archive
        id: pull_logs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m vlr_pipeline logs pull

      - name: Run pipeline (scrape + process + upload)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # el cron no tiene inputs: siempre incremental
          FULL_UPLOAD: ${{ inputs.full && '--full' || '' }}
        run: |
          mkdir -p logs
          # --log-level/--log-file son flags globales: van antes del subcomando.
          # Matches con error en el scrape no cortan: el cli sale 0 y emite el ::warning:: el mismo.
          python -m vlr_pipeline --log-level INFO --log-file logs/pipeline.log all $FULL_UPLOAD

      # Para el job dbt: las tablas que lee (dbt/models/staging/vlr/_vlr__sources.yml), no las que no se
      # suben a Supabase. Cada job corre en una maquina nueva; el artifact es como se pasan archivos entre jobs.
      - name: Upload tables for dbt
        uses: actions/upload-artifact@v6
        with:
          name: tables
          path: |
            tables/table_*.csv
            !tables/table_round_situations.csv
            !tables/table_situation_stats.csv
            !tables/table_agent_info.csv
          retention-days: 1

      # always(): aunque falle el process o el upload, lo scrapeado se archiva y se commitea.
      # Solo si el pull salio bien: sin el archivo completo en disco no hay que pisar el remoto.
      - name: Push logs archive
        id: archive
        if: always() && steps.pull_logs.outcome == 'success'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m vlr_pipeline logs push

      # Solo si el archivo subio: has_logs=True en scrape_log tiene que apuntar a filas que estan en
      # la version del manifest. Si no se commitea, la proxima corrida re-scrapea (purge + upsert
      # son idempotentes) en vez de dejar has_logs apuntando a csv perdidos con el runner.
      - name: Commit scraped data
        if: always() && steps.archive.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add csv
          git diff --cached --quiet && { echo "Sin datos nuevos, no se commitea"; exit 0; }
          git commit -m "data: actualizacion automatica $(date -u +%Y-%m-%d)"
          # por si se pusheo algo mientras corria el job
          git pull --rebase
          git push

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pipeline-log
          path: logs/pipeline.log
          if-no-files-found: ignore
          retention-days: 14

  # Capa analitica (dbt/, paso 8 de handoff/DBT_PLAN.md) sobre las tablas que armo el job run. Nunca afecta al
  # pipeline: corre despues (needs) y continue-on-error hace que si falla la corrida no quede en rojo.
  # Solo la parte de vlr: grid/raw/ (datos con licencia) no esta en el runner, asi que se excluye el source grid y
  # todo lo que depende de el (+). Sin snapshot: en una base que se tira al final no acumula historial.
  dbt:
    needs: run
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dbt.txt

      - name: Install dbt
        run: pip install -r ../requirements-dbt.txt

      - name: Download tables
        uses: actions/download-artifact@v6
        with:
          name: tables
          path: tables

      # dbt_utils (packages.yml; version fija en package-lock.yml)
      - name: dbt deps
        run: dbt deps

      # --target ci: base descartable (profiles.yml). --selector ci: que se corre (dbt/selectors.yml). Los tests
      # en warn no cortan; un ERROR deja un warning en el resumen de la corrida, como los partidos con error del
      # scrape.
      - name: dbt build
        run: |
          dbt build --target ci --selector ci \
            || { echo "::warning::dbt build fallo (ver el log del job dbt y el artifact dbt-artifacts)"; exit 1; }

      # run_results.json = resultado de cada modelo y test; manifest.json = el proyecto compilado (grafo, SQL).
      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dbt-artifacts
          path: |
            dbt/target/run_results.json
            dbt/target/manifest.json
            dbt/logs/dbt.log
          if-no-files-found: ignore
          retention-days: 14
