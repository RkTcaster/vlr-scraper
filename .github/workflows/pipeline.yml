name: vlr-pipeline

on:
  schedule:
    # El cron de GitHub va SIEMPRE en UTC. 17:00 UTC = 01:00 Shanghai (UTC+8) = 14:00 Argentina.
    # Champions 2026 (Shanghai): partidos 17:00 y 20:00 Shanghai (09:00 y 12:00 UTC), el
    # ultimo termina ~23:00 Shanghai; playoffs de octubre arrancan mas temprano. Con 17:00 UTC
    # todo lo del dia ya esta Completed. GitHub puede demorar el arranque 10-60 min.
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Upload completo (todas las filas). Usar si cambio el codigo/lookups o se borro algo en Supabase"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vlr-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # misma version con la que se probo el pipeline localmente (pandas 3)
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (scrape + process + upload)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # el cron no tiene inputs: siempre incremental
          FULL_UPLOAD: ${{ inputs.full && '--full' || '' }}
        run: |
          mkdir -p logs
          # --log-level/--log-file son flags globales: van antes del subcomando.
          # Matches con error en el scrape no cortan: el cli sale 0 y emite el ::warning:: el mismo.
          python -m vlr_pipeline --log-level INFO --log-file logs/pipeline.log all $FULL_UPLOAD

      # always(): si falla el process o el upload, lo scrapeado igual queda commiteado
      # y la proxima corrida no lo vuelve a pedir.
      - name: Commit scraped data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add csv
          git diff --cached --quiet && { echo "Sin datos nuevos, no se commitea"; exit 0; }
          git commit -m "data: actualizacion automatica $(date -u +%Y-%m-%d)"
          # por si se pusheo algo mientras corria el job
          git pull --rebase
          git push

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pipeline-log
          path: logs/pipeline.log
          if-no-files-found: ignore
          retention-days: 14
