name: vlr-pipeline

on:
  schedule:
    # 06:00 UTC = 03:00 Argentina. Ajustar a gusto.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vlr-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # misma version con la que se probo el pipeline localmente (pandas 3)
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (scrape + process + upload)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          mkdir -p logs
          set +e
          # --log-level/--log-file son flags globales: van antes del subcomando
          python -m vlr_pipeline --log-level INFO --log-file logs/pipeline.log all
          code=$?
          # exit 2 = scrape termino pero algunos matches quedaron con status error en csv/scrape_log.csv;
          # se registra el warning pero igual se commitea y sube lo que salio bien.
          if [ "$code" -eq 2 ]; then
            echo "::warning::algunos matches fallaron; revisar csv/scrape_log.csv"
            exit 0
          fi
          exit $code

      # always(): si falla el process o el upload, lo scrapeado igual queda commiteado
      # y la proxima corrida no lo vuelve a pedir.
      - name: Commit scraped data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add csv
          if git diff --cached --quiet; then
            echo "Sin datos nuevos, no se commitea"
          else
            git commit -m "data: actualizacion automatica $(date -u +%Y-%m-%d)"
            # por si se pusheo algo mientras corria el job
            git pull --rebase
            git push
          fi

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log
          path: logs/pipeline.log
          if-no-files-found: ignore
          retention-days: 14
