name: vlr-pipeline

on:
  schedule:
    # El cron de GitHub va SIEMPRE en UTC. 17:00 UTC = 01:00 Shanghai (UTC+8) = 14:00 Argentina.
    # Champions 2026 (Shanghai): partidos 17:00 y 20:00 Shanghai (09:00 y 12:00 UTC), el
    # ultimo termina ~23:00 Shanghai; playoffs de octubre arrancan mas temprano. Con 17:00 UTC
    # todo lo del dia ya esta Completed. GitHub puede demorar el arranque 10-60 min.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Upload completo (todas las filas). Usar si cambio el codigo/lookups o se borro algo en Supabase"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vlr-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # main actual y no github.sha: un "Re-run" de una corrida vieja usa el sha original, y
      # correria codigo viejo sobre un scrape_log viejo (y el push termina en conflicto)
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          # misma version con la que se probo el pipeline localmente (pandas 3)
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # round_buy_/round_events_ no estan en git (vlr_pipeline/logs_archive.py): se bajan del bucket
      # de Supabase Storage. Si falla se corta la corrida: sin logs el process armaria tablas incompletas.
      - name: Pull logs archive
        id: pull_logs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m vlr_pipeline logs pull

      - name: Run pipeline (scrape + process + upload)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # el cron no tiene inputs: siempre incremental
          FULL_UPLOAD: ${{ inputs.full && '--full' || '' }}
        run: |
          mkdir -p logs
          # --log-level/--log-file son flags globales: van antes del subcomando.
          # Matches con error en el scrape no cortan: el cli sale 0 y emite el ::warning:: el mismo.
          python -m vlr_pipeline --log-level INFO --log-file logs/pipeline.log all $FULL_UPLOAD

      # always(): aunque falle el process o el upload, lo scrapeado se archiva y se commitea.
      # Solo si el pull salio bien: sin el archivo completo en disco no hay que pisar el remoto.
      - name: Push logs archive
        id: archive
        if: always() && steps.pull_logs.outcome == 'success'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m vlr_pipeline logs push

      # Solo si el archivo subio: has_logs=True en scrape_log tiene que apuntar a filas que estan en
      # la version del manifest. Si no se commitea, la proxima corrida re-scrapea (purge + upsert
      # son idempotentes) en vez de dejar has_logs apuntando a csv perdidos con el runner.
      - name: Commit scraped data
        if: always() && steps.archive.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add csv
          git diff --cached --quiet && { echo "Sin datos nuevos, no se commitea"; exit 0; }
          git commit -m "data: actualizacion automatica $(date -u +%Y-%m-%d)"
          # por si se pusheo algo mientras corria el job
          git pull --rebase
          git push

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pipeline-log
          path: logs/pipeline.log
          if-no-files-found: ignore
          retention-days: 14
